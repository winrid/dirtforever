[project]
name = "dirtforever"
version = "0.1.0"
description = "DiRT Rally 2.0 community server"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["dr2server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
